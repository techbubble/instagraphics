<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      iframe { border: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <iframe id="app" allow="clipboard-write"></iframe>
    <script>
      // Reopen where the user left off; the site reports its path.
      var BASE = <?= baseUrl ?>;
      var frame = document.getElementById("app");
      var path = "/";
      try {
        var saved = localStorage.getItem("ig:lastPath");
        if (saved && saved.charAt(0) === "/") path = saved;
      } catch (e) {}
      frame.src = BASE + path;

      window.addEventListener("message", function (e) {
        if (e.origin !== BASE || e.source !== frame.contentWindow) return;
        var d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "ig:path" && typeof d.path === "string" && d.path.charAt(0) === "/") {
          try { localStorage.setItem("ig:lastPath", d.path); } catch (err) {}
        }
        if (d.type === "ig:need-identity") {
          google.script.run
            .withSuccessHandler(function (token) {
              frame.contentWindow.postMessage(
                token ? { type: "ig:identity", token: token } : { type: "ig:identity-error", message: "No identity token" },
                BASE
              );
            })
            .withFailureHandler(function (err) {
              frame.contentWindow.postMessage({ type: "ig:identity-error", message: (err && err.message) || String(err) }, BASE);
            })
            .getIdentityToken();
        }
        if (d.type === "ig:insert" && typeof d.data === "string") {
          var reply = function (msg) { frame.contentWindow.postMessage(msg, BASE); };
          google.script.run
            .withSuccessHandler(function () { reply({ type: "ig:inserted", id: d.id }); })
            .withFailureHandler(function (err) {
              reply({ type: "ig:insert-error", id: d.id, message: (err && err.message) || String(err) });
            })
            .insertImage(d.data, d.mime, d.name);
        }
      });
    </script>
  </body>
</html>
